[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-solutions"
version = "0.1.0"
description = "Exact solutions of lattice models, as references for numerical work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/pcchen/Exact_Solution"

[tool.setuptools]
packages = ["exact_solutions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
